{{- $scripts := slice (resources.Get "js/main.js") }}
{{- /* Скрипт галереи — только там, где в одном <figure> несколько картинок */}}
{{- if findRE `<figure>\s*<img[^>]*>\s*<img` .Content 1 }}
  {{- $scripts = $scripts | append (resources.Get "js/gallery.js") }}
{{- end }}
{{- range $scripts }}
  {{- $script := . }}
  {{- if hugo.IsProduction }}{{ $script = . | resources.Minify | resources.Fingerprint }}{{ end }}
<script src="{{ $script.RelPermalink }}" {{ if hugo.IsProduction }}integrity="{{ $script.Data.Integrity }}"{{ end }}></script>
{{- end }}
