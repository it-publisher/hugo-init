{{- $url := .Permalink }}
{{- $title := .Title }}
<div class="mt-8 pt-6 border-t border-gray-200 dark:border-neutral-800">
  <div class="flex flex-wrap items-center gap-3 text-sm">
    <span class="font-medium text-gray-900 dark:text-white">Поделиться:</span>
    {{- /* Системное меню «Поделиться» — показывает main.js, если браузер его поддерживает (обычно телефон) */}}
    <button type="button" data-native-share data-url="{{ $url }}" data-title="{{ $title }}" hidden
            class="px-3 py-2 rounded-full bg-primary-600 text-white hover:bg-primary-700 transition-colors">Отправить…</button>
    <a href="https://t.me/share/url?url={{ $url | urlquery }}&text={{ $title | urlquery }}" target="_blank" rel="noopener"
       class="px-3 py-2 rounded-full bg-gray-100 dark:bg-neutral-900 text-gray-600 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 dark:hover:bg-primary-900/40 dark:hover:text-primary-300 transition-colors">Телеграм</a>
    <a href="https://vk.com/share.php?url={{ $url | urlquery }}&title={{ $title | urlquery }}" target="_blank" rel="noopener"
       class="px-3 py-2 rounded-full bg-gray-100 dark:bg-neutral-900 text-gray-600 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 dark:hover:bg-primary-900/40 dark:hover:text-primary-300 transition-colors">ВКонтакте</a>
    <button type="button" data-copy-url="{{ $url }}"
            class="px-3 py-2 rounded-full bg-gray-100 dark:bg-neutral-900 text-gray-600 dark:text-gray-300 hover:bg-primary-100 hover:text-primary-700 dark:hover:bg-primary-900/40 dark:hover:text-primary-300 transition-colors">Скопировать ссылку</button>
  </div>
</div>
