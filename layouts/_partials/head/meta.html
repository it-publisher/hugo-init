<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="author" content="{{ .Params.author | default site.Params.author }}">
{{- with partial "post-terms.html" . }}
  {{- $names := slice }}
  {{- range . }}{{ $names = $names | append .LinkTitle }}{{ end }}
<meta name="keywords" content="{{ delimit $names ", " }}">
{{- end }}
{{- with .OutputFormats.Get "rss" }}
<link href="{{ .Permalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Title }}">
{{- end }}
<link rel="sitemap" type="application/xml" href="{{ "sitemap.xml" | relURL }}">
<meta name="theme-color" content="#2563eb">
